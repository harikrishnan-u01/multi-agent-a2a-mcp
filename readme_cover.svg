<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFCFF"/>
      <stop offset="100%" style="stop-color:#EEF4FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F8FAFC"/>
    </linearGradient>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EBF5FF"/>
      <stop offset="100%" style="stop-color:#DBEAFE"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0FF"/>
      <stop offset="100%" style="stop-color:#EDE9FE"/>
    </linearGradient>
    <marker id="arrowA2A" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowMCP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#CBD5E1" opacity="0.4"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#94A3B8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect x="0" y="0" width="6" height="1080" fill="#2563EB" opacity="0.85"/>

  <!-- TITLE -->
  <text x="60" y="78" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="-0.5">I Built a Multi-Agent AI System from Scratch</text>
  <text x="60" y="118" font-size="23" fill="#2563EB" font-weight="500">A2A  ·  MCP  ·  Ollama  ·  5 Real Engineering Challenges</text>
  <line x1="60" y1="138" x2="860" y2="138" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- TOP-RIGHT -->
  <text x="1860" y="60" font-size="19" fill="#64748B" text-anchor="end">github.com/harikrishnan-u01/multi-agent-a2a-mcp</text>
  <text x="1860" y="86" font-size="15" fill="#94A3B8" text-anchor="end">Python  ·  FastAPI  ·  Pydantic  ·  HTTPX  ·  Rich</text>

  <!-- ═══════════════ DIAGRAM ═══════════════ -->

  <!-- USER PROMPT (cx=960, y=178, h=58, bottom=236) -->
  <rect x="810" y="178" width="300" height="58" rx="8" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="212" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="600">User Prompt</text>
  <text x="960" y="230" font-size="12" fill="#64748B" text-anchor="middle">python main.py "Plan my weekend..."</text>

  <!-- User → Orchestrator -->
  <line x1="960" y1="236" x2="960" y2="278" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowA2A)"/>

  <!-- ORCHESTRATOR (x=710, w=500, cx=960, y=280, h=92, bottom=372) -->
  <rect x="710" y="280" width="500" height="92" rx="10" fill="url(#orchGrad)" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="317" font-size="21" fill="#1E3A5F" text-anchor="middle" font-weight="700">Orchestrator Agent</text>
  <text x="960" y="341" font-size="13" fill="#2563EB" text-anchor="middle">validate → parse intent → decompose → delegate → synthesize</text>
  <text x="960" y="361" font-size="12" fill="#64748B" text-anchor="middle">orchestrator/  ·  :9000</text>

  <!-- A2A protocol separator -->
  <text x="960" y="396" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="600" opacity="0.7">── A2A Protocol (JSON-RPC / HTTP) ──</text>

  <!-- Fan-out: Orchestrator → 3 Agents
       Agents top y=418, cx: Planner=560, Wellness=960, Learning=1360
       "horizontal-then-drop" curves: depart horizontally, arrive pointing straight down -->
  <path d="M 830 372 Q 560 372 560 418" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowA2A)"/>
  <line x1="960" y1="372" x2="960" y2="416" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrowA2A)"/>
  <path d="M 1090 372 Q 1360 372 1360 418" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowA2A)"/>

  <!-- PLANNER AGENT (x=400, w=320, cx=560, y=418, h=85, bottom=503) -->
  <rect x="400" y="418" width="320" height="85" rx="10" fill="url(#cardGrad)" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="451" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="600">Planner Agent</text>
  <text x="560" y="471" font-size="12" fill="#64748B" text-anchor="middle">planner_server.py  ·  :9003</text>
  <text x="560" y="491" font-size="13" fill="#2563EB" text-anchor="middle">weekend skeleton</text>

  <!-- WELLNESS AGENT (x=800, w=320, cx=960, y=418, h=85, bottom=503) -->
  <rect x="800" y="418" width="320" height="85" rx="10" fill="url(#cardGrad)" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="451" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="600">Wellness Agent</text>
  <text x="960" y="471" font-size="12" fill="#64748B" text-anchor="middle">wellness_server.py  ·  :9001</text>
  <text x="960" y="491" font-size="13" fill="#2563EB" text-anchor="middle">activities · meals · tips</text>

  <!-- LEARNING AGENT (x=1200, w=320, cx=1360, y=418, h=85, bottom=503) -->
  <rect x="1200" y="418" width="320" height="85" rx="10" fill="url(#cardGrad)" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1360" y="451" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="600">Learning Agent</text>
  <text x="1360" y="471" font-size="12" fill="#64748B" text-anchor="middle">learning_server.py  ·  :9002</text>
  <text x="1360" y="491" font-size="13" fill="#2563EB" text-anchor="middle">topics · resources · schedule</text>

  <!-- MCP protocol separator -->
  <text x="960" y="528" font-size="13" fill="#7C3AED" text-anchor="middle" font-weight="600" opacity="0.7">── MCP Protocol (POST /tools/invoke) ──</text>

  <!-- Fan-in: 3 Agents → MCP Server
       MCP top y=556, arrive at: Planner→860, Wellness→960, Learning→1060
       "sweep-then-drop" curves: depart horizontally from agent bottom, arrive straight down -->
  <path d="M 560 503 Q 860 503 860 554" stroke="#7C3AED" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowMCP)"/>
  <line x1="960" y1="503" x2="960" y2="554" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrowMCP)"/>
  <path d="M 1360 503 Q 1060 503 1060 554" stroke="#7C3AED" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowMCP)"/>

  <!-- MCP SERVER (x=760, w=400, cx=960, y=556, h=85, bottom=641) -->
  <rect x="760" y="556" width="400" height="85" rx="10" fill="url(#mcpGrad)" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="591" font-size="20" fill="#3B0764" text-anchor="middle" font-weight="700">MCP Server</text>
  <text x="960" y="613" font-size="13" fill="#7C3AED" text-anchor="middle">mcp_server/  ·  :8000  ·  Tool Registry + Dispatcher</text>
  <text x="960" y="632" font-size="12" fill="#64748B" text-anchor="middle">POST /tools/invoke</text>

  <!-- Fan-out: MCP → 4 Tools
       Tools top y=685, cx: WellnessAPI=465, LearningAPI=795, PyFns=1125, Ollama=1455
       "depart from MCP bottom, horizontal then drop" -->
  <path d="M 820 641 Q 465 641 465 683" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arrowMCP)"/>
  <path d="M 900 641 Q 795 641 795 683" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arrowMCP)"/>
  <path d="M 1020 641 Q 1125 641 1125 683" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arrowMCP)"/>
  <path d="M 1100 641 Q 1455 641 1455 683" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arrowMCP)"/>

  <!-- WELLNESS REST API (x=325, w=280, cx=465, y=685, h=82) -->
  <rect x="325" y="685" width="280" height="82" rx="10" fill="url(#cardGrad)" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="465" y="716" font-size="16" fill="#16A34A" text-anchor="middle" font-weight="600">Wellness REST API</text>
  <text x="465" y="736" font-size="12" fill="#64748B" text-anchor="middle">mock_apis/  ·  :8001</text>
  <text x="465" y="754" font-size="12" fill="#16A34A" text-anchor="middle">activities · meals</text>

  <!-- LEARNING REST API (x=655, w=280, cx=795, y=685, h=82) -->
  <rect x="655" y="685" width="280" height="82" rx="10" fill="url(#cardGrad)" stroke="#0891B2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="716" font-size="16" fill="#0891B2" text-anchor="middle" font-weight="600">Learning REST API</text>
  <text x="795" y="736" font-size="12" fill="#64748B" text-anchor="middle">mock_apis/  ·  :8002</text>
  <text x="795" y="754" font-size="12" fill="#0891B2" text-anchor="middle">topics · resources</text>

  <!-- PYTHON FUNCTIONS (x=985, w=280, cx=1125, y=685, h=82) -->
  <rect x="985" y="685" width="280" height="82" rx="10" fill="url(#cardGrad)" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1125" y="716" font-size="16" fill="#DC2626" text-anchor="middle" font-weight="600">Python Functions</text>
  <text x="1125" y="736" font-size="12" fill="#64748B" text-anchor="middle">tools/local_tools.py</text>
  <text x="1125" y="754" font-size="12" fill="#DC2626" text-anchor="middle">date · calculate · time-blocks</text>

  <!-- OLLAMA LLM (x=1315, w=280, cx=1455, y=685, h=82) -->
  <rect x="1315" y="685" width="280" height="82" rx="10" fill="url(#cardGrad)" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1455" y="716" font-size="16" fill="#D97706" text-anchor="middle" font-weight="600">Ollama LLM</text>
  <text x="1455" y="736" font-size="12" fill="#64748B" text-anchor="middle">tools/ollama_tools.py</text>
  <text x="1455" y="754" font-size="12" fill="#D97706" text-anchor="middle">llama3.2 · intent · summarize</text>

  <!-- LEGEND -->
  <rect x="60" y="878" width="530" height="76" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <line x1="90" y1="906" x2="148" y2="906" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowA2A)"/>
  <text x="164" y="911" font-size="16" fill="#2563EB" font-weight="600">A2A Protocol</text>
  <text x="290" y="911" font-size="14" fill="#64748B">Agent-to-Agent  ·  JSON-RPC / HTTP</text>
  <line x1="90" y1="934" x2="148" y2="934" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowMCP)"/>
  <text x="164" y="939" font-size="16" fill="#7C3AED" font-weight="600">MCP Protocol</text>
  <text x="290" y="939" font-size="14" fill="#64748B">Model Context Protocol  ·  Tool Gateway</text>

  <!-- BOTTOM -->
  <text x="960" y="1010" font-size="14" fill="#94A3B8" text-anchor="middle">#AgenticAI  ·  #A2A  ·  #MCP  ·  #Python  ·  #LLM  ·  #BuildInPublic</text>
  <text x="1860" y="990" font-size="20" fill="#0F172A" text-anchor="end" font-weight="600">Harikrishnan</text>
  <text x="1860" y="1010" font-size="14" fill="#64748B" text-anchor="end">github.com/harikrishnan-u01/multi-agent-a2a-mcp</text>
  <rect x="0" y="1074" width="1920" height="6" fill="#2563EB" opacity="0.5"/>
</svg>
